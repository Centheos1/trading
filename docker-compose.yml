# Trading App — Collector host (greenfield Parquet-only)
#
# Collector EC2 runs ONLY:
#   redis (dev profile) | data-btc | data-eth | ohlcv
#
# Strategy and BookMap live on separate hosts and subscribe to ElastiCache
# Streams ``md:{venue}:{kind}``. Do not start strategy on this box.
#
# Quick start (dev with bundled Redis):
#
#   cp .env.template .env
#   docker compose --profile bundled-redis up -d
#
# Production (ElastiCache): set REDIS_URL in .env, no bundled-redis profile.
#
#   docker compose --profile ohlcv up -d

services:

  # ------------------------------------------------------------------
  # Local Redis — laptop/dev only. Prod uses ElastiCache via REDIS_URL.
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["bundled-redis"]

  # ------------------------------------------------------------------
  # Per-symbol tick collectors (immutable Parquet shards + Redis Streams)
  # ------------------------------------------------------------------
  data-btc:
    build:
      context: .
      dockerfile: data/Dockerfile
    container_name: trading-data-BTCUSDT
    restart: unless-stopped
    stop_grace_period: 120s
    mem_reservation: 1g
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: >
      python collect_ticks.py
        --symbol BTCUSDT
        --venue binance
        --parquet-flush-interval ${PARQUET_FLUSH_INTERVAL:-60}
        --log-level ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "collect_ticks.py", "--health-check",
             "--symbol", "BTCUSDT", "--max-staleness-seconds", "300",
             "--data-dir", "/app/data"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

  data-eth:
    build:
      context: .
      dockerfile: data/Dockerfile
    container_name: trading-data-ETHUSDT
    restart: unless-stopped
    stop_grace_period: 120s
    mem_reservation: 1g
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: >
      python collect_ticks.py
        --symbol ETHUSDT
        --venue binance
        --parquet-flush-interval ${PARQUET_FLUSH_INTERVAL:-60}
        --log-level ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "collect_ticks.py", "--health-check",
             "--symbol", "ETHUSDT", "--max-staleness-seconds", "300",
             "--data-dir", "/app/data"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

  # Back-compat alias: single multi-symbol process that forks children.
  # Prefer data-btc / data-eth for true cgroup isolation.
  data:
    build:
      context: .
      dockerfile: data/Dockerfile
    container_name: trading-data
    restart: unless-stopped
    stop_grace_period: 120s
    mem_reservation: 1g
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: >
      python collect_ticks.py
        --symbols ${SYMBOLS:-BTCUSDT,ETHUSDT}
        --venue binance
        --parquet-flush-interval ${PARQUET_FLUSH_INTERVAL:-60}
        --log-level ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    profiles: ["legacy-multi"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "collect_ticks.py", "--health-check",
             "--symbols", "BTCUSDT", "--max-staleness-seconds", "300",
             "--data-dir", "/app/data"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

  # ------------------------------------------------------------------
  # OHLCV historical collector (hard-capped; re-fetchable)
  # ------------------------------------------------------------------
  ohlcv-collector:
    build:
      context: .
      dockerfile: data/Dockerfile
    container_name: trading-ohlcv-collector
    restart: unless-stopped
    mem_limit: 1.25g
    memswap_limit: 1.25g
    cpus: "1.5"
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    command: >
      python collect_ohlcv.py
        --exchange ${OHLCV_EXCHANGE:-all}
        --all-symbols
        --timeframe ${OHLCV_TIMEFRAME:-1m}
        --from-date ${OHLCV_FROM_DATE:-2020-01-01}
        --mode ${OHLCV_MODE:-continuous}
        --poll-interval ${OHLCV_POLL_INTERVAL:-3600}
        --workers ${OHLCV_WORKERS:-2}
        --data-store ${DATA_STORE:-s3}
        --s3-bucket ${S3_BUCKET:-}
        --log-level ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys; sys.exit(0)"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["ohlcv"]

  # ------------------------------------------------------------------
  # Strategy — NOT for collector EC2. Profile-gated for local full-stack.
  # ------------------------------------------------------------------
  strategy:
    build:
      context: .
      dockerfile: strategy/Dockerfile
    container_name: trading-strategy
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      SYMBOLS: "${SYMBOLS:-BTCUSDT}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      CANDLE_BUCKET_MS: "${CANDLE_BUCKET_MS:-60000}"
    command: >
      uvicorn strategy.main:app
        --host 0.0.0.0
        --port 8000
        --workers 1
        --log-level info
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    profiles: ["strategy"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  bookmap-publisher:
    build:
      context: .
      dockerfile: strategy/Dockerfile
    container_name: trading-bookmap-publisher
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: >
      python -m bookmap_publisher.mock_emitter
        --symbol ${SYMBOLS:-BTCUSDT}
        --host 0.0.0.0
        --port 8765
        --log-level ${LOG_LEVEL:-INFO}
    ports:
      - "8765:8765"
    volumes:
      - ./bookmap_publisher:/app/bookmap_publisher:ro
    profiles: ["bookmap"]

  test:
    build:
      context: .
      dockerfile: data/Dockerfile
    container_name: trading-test
    environment:
      PYTHONUNBUFFERED: "1"
    command: python -m unittest discover -s tests -v
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - .:/app
    profiles: ["test"]
