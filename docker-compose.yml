# Trading App — Docker Compose
#
# Profiles:
#   (default)          collector     — BTCUSDT tick data collector (EC2 / headless)
#   --profile multi    collector-eth — Add ETHUSDT as a second collector
#   --profile ui       app           — Trading UI (requires X11 / XQuartz)
#   --profile test     test          — Run full test suite and exit
#
# Quick-start (EC2 data collection):
#   cp .env.template .env && nano .env   # set S3_BUCKET
#   docker compose up -d
#
# Local UI (macOS — requires XQuartz running):
#   xhost +localhost
#   docker compose --profile ui up app
#
# Run tests:
#   docker compose --profile test run --rm test

x-base: &base
  build:
    context: .
    dockerfile: Dockerfile.dev
  env_file: .env                       # S3_BUCKET, SYMBOLS, BINANCE_* etc.
  environment:
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./data:/app/data                 # HDF5 files survive container restarts
    - ./logs:/app/logs                 # rotating log files
    - .:/app                           # live source mount (dev / local use)
  restart: "no"                        # overridden per-service below

services:

  # ── BTCUSDT tick data collector (always-on, EC2 primary service) ──
  collector:
    <<: *base
    container_name: trading-collector-btcusdt
    command: >
      python collect_ticks.py
        --symbol ${SYMBOLS:-BTCUSDT}
        --s3-bucket ${S3_BUCKET:-}
        --log-level ${LOG_LEVEL:-INFO}
    restart: unless-stopped            # survives crashes and EC2 reboots
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os, time; age=time.time()-os.path.getmtime('data/binance_ticks.h5'); exit(0 if age<120 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── ETHUSDT second collector (opt-in) ────────────────────────────
  collector-eth:
    <<: *base
    container_name: trading-collector-ethusdt
    command: >
      python collect_ticks.py
        --symbol ETHUSDT
        --s3-bucket ${S3_BUCKET:-}
        --s3-key ticks/binance_ticks_ETHUSDT.h5
        --data-dir data/ETHUSDT
        --log-level ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    profiles: ["multi"]

  # ── Trading UI (local / EC2 g5 with display) ─────────────────────
  app:
    <<: *base
    container_name: trading-app-ui
    command: python main.py
    restart: "no"
    environment:
      PYTHONUNBUFFERED: "1"
      DISPLAY: "${DISPLAY:-host.docker.internal:0}"
      QT_QPA_PLATFORM: "${QT_QPA_PLATFORM:-xcb}"
      QSG_RHI_BACKEND: "${QSG_RHI_BACKEND:-software}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11 passthrough (Linux / XQuartz)
    profiles: ["ui"]
    stdin_open: true
    tty: true

  # ── Test runner (CI / smoke check) ───────────────────────────────
  test:
    <<: *base
    container_name: trading-app-test
    command: python -m unittest discover -s tests -v
    restart: "no"
    environment:
      PYTHONUNBUFFERED: "1"
      QT_QPA_PLATFORM: offscreen
      QSG_RHI_BACKEND: software
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - .:/app
    profiles: ["test"]
