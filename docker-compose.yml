# Trading App — Docker Compose (local development)
#
# Three services compose the distributed stack:
#
#   redis     — pub/sub bus between data and strategy services
#   data      — Binance WS → HDF5 + Redis (trades:{SYM}, depth:{SYM})
#   strategy  — headless OrderFlowEngine + FastAPI REST (/api)
#
# Quick start:
#
#   cp .env.template .env && nano .env       # set SYMBOLS, S3_BUCKET if any
#   docker compose up
#
# Tests still live under the `test` profile:
#
#   docker compose --profile test run --rm test
#
# Production deployment uses docker-compose.prod.yml.

services:

  # ------------------------------------------------------------------
  # Redis pub/sub bus
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # Data collector — Binance futures WS → HDF5 + Redis pub/sub
  # ------------------------------------------------------------------
  data:
    build:
      context: .
      dockerfile: data/Dockerfile
    container_name: trading-data
    restart: unless-stopped
    # Allow 120 s for each child collector to flush Parquet + upload HDF5
    # to S3 before Docker force-kills the container.
    stop_grace_period: 120s
    # Tick data is the protected priority — it cannot be re-fetched from any
    # API, so the scheduler must keep this container's working set resident.
    # The ohlcv-collector is hard-capped (see below) so it can never starve
    # this service of memory on the shared host.
    mem_reservation: 1g
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://redis:6379"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: >
      python collect_ticks.py
        --symbols ${SYMBOLS:-BTCUSDT,ETHUSDT}
        --s3-bucket ${S3_BUCKET:-}
        --parquet-flush-interval ${PARQUET_FLUSH_INTERVAL:-900}
        --max-h5-gb ${MAX_H5_GB:-8}
        --log-level ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      # Healthy when at least one per-symbol HDF5 file under data/ticks/
      # was mtime-updated in the last 2 minutes (i.e. WS data is flowing).
      test: ["CMD", "python", "-c",
             "import glob, os, sys, time; files = glob.glob('/app/data/ticks/*_ticks.h5'); sys.exit(0 if files and (time.time() - max(os.path.getmtime(f) for f in files)) < 120 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ------------------------------------------------------------------
  # Strategy engine — FastAPI REST control plane
  # ------------------------------------------------------------------
  strategy:
    build:
      context: .
      dockerfile: strategy/Dockerfile
    container_name: trading-strategy
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://redis:6379"
      SYMBOLS: "${SYMBOLS:-BTCUSDT}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      CANDLE_BUCKET_MS: "${CANDLE_BUCKET_MS:-60000}"
    command: >
      uvicorn strategy.main:app
        --host 0.0.0.0
        --port 8000
        --workers 1
        --log-level ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ------------------------------------------------------------------
  # OHLCV historical collector (opt-in profile)
  # ------------------------------------------------------------------
  ohlcv-collector:
    build:
      context: .
      dockerfile: data/Dockerfile
    container_name: trading-ohlcv-collector
    restart: unless-stopped
    # Hard memory cap (cgroup limit). OHLCV is re-fetchable from the venue
    # APIs, so it is the expendable workload here: if it ever overshoots, the
    # cgroup OOM-killer reaps ONLY this container's process (which then resumes
    # from the last persisted year), and the tick collector is never touched.
    # memswap_limit == mem_limit disables swap for this container so it cannot
    # drag the whole host into swap-thrashing (the original failure mode).
    mem_limit: 1.25g
    memswap_limit: 1.25g
    cpus: "1.5"
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    command: >
      python collect_ohlcv.py
        --exchange ${OHLCV_EXCHANGE:-all}
        --all-symbols
        --timeframe ${OHLCV_TIMEFRAME:-1m}
        --from-date ${OHLCV_FROM_DATE:-2020-01-01}
        --mode ${OHLCV_MODE:-continuous}
        --poll-interval ${OHLCV_POLL_INTERVAL:-3600}
        --workers ${OHLCV_WORKERS:-2}
        --data-store ${DATA_STORE:-s3}
        --s3-bucket ${S3_BUCKET:-}
        --log-level ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    profiles: ["ohlcv"]

  # ------------------------------------------------------------------
  # Bookmap mock event publisher (opt-in profile)
  #
  # Stand-alone WebSocket publisher used to drive the Bookmap Java
  # add-on without the full trading stack. Brings up a single
  # container that emits ENTRY, EXIT, METRIC, POSITION, and HEALTH
  # events to ws://localhost:8765 so the add-on can be exercised end-
  # to-end during development.
  #
  # Activation:
  #
  #   docker compose --profile bookmap up bookmap-publisher
  #
  # The Bookmap add-on is a Java module that runs inside the Bookmap
  # process on the host — it is NOT containerised here. See
  # docs/BOOKMAP_INTEGRATION.md for the full event flow.
  # ------------------------------------------------------------------
  bookmap-publisher:
    build:
      context: .
      dockerfile: strategy/Dockerfile
    container_name: trading-bookmap-publisher
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: >
      python -m bookmap_publisher.mock_emitter
        --symbol ${SYMBOLS:-BTCUSDT}
        --host 0.0.0.0
        --port 8765
        --log-level ${LOG_LEVEL:-INFO}
    ports:
      - "8765:8765"
    volumes:
      - ./bookmap_publisher:/app/bookmap_publisher:ro
    profiles: ["bookmap"]

  # ------------------------------------------------------------------
  # Test runner (kept for parity with the legacy compose file)
  # ------------------------------------------------------------------
  test:
    build:
      context: .
      dockerfile: strategy/Dockerfile
    container_name: trading-test
    environment:
      PYTHONUNBUFFERED: "1"
    command: python -m unittest discover -s tests -v
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - .:/app
    profiles: ["test"]
