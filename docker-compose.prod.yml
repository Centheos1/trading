# Production overrides — collector EC2 only.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile ohlcv up -d
#
# Topology:
#   Redis     → ElastiCache (REDIS_URL required; no bundled redis)
#   data-btc / data-eth → always-on tick collectors
#   ohlcv     → profile ohlcv, hard memory-capped
#   strategy  → never on this host (separate EC2 later)

services:

  redis:
    profiles: ["bundled-redis", "never"]

  data-btc:
    restart: always
    environment:
      LOG_LEVEL: "INFO"
      REDIS_URL: "${REDIS_URL:?REDIS_URL must point at ElastiCache in prod}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  data-eth:
    restart: always
    environment:
      LOG_LEVEL: "INFO"
      REDIS_URL: "${REDIS_URL:?REDIS_URL must point at ElastiCache in prod}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  ohlcv-collector:
    restart: always
    environment:
      LOG_LEVEL: "INFO"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  strategy:
    profiles: ["never"]

  bookmap-publisher:
    profiles: ["never"]
