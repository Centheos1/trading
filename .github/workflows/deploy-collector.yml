name: Deploy Collector

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'collect_ticks.py'
      - 'collect_ohlcv.py'
      - 'tick_parquet_store.py'
      - 'market_data.py'
      - 'redis_md_bus.py'
      - 'adapters/**'
      - 'data_service.py'
      - 'ohlcv_store.py'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'scripts/s3_sync.sh'
      - 'scripts/pipeline_health.sh'
      - '.github/workflows/deploy-collector.yml'

permissions:
  id-token: write
  contents: read

environment: production  # approval gate — never auto-wipe live ticks

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      - name: Build and push (optional ECR)
        if: ${{ vars.ECR_REPOSITORY != '' }}
        run: |
          echo "ECR push not configured in first slice — SSM pulls from git"
      - name: SSM deploy collector stack
        env:
          INSTANCE_ID: ${{ vars.COLLECTOR_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${INSTANCE_ID:-}" ]; then
            echo "COLLECTOR_INSTANCE_ID not set — skipping SSM deploy"
            exit 0
          fi
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy greenfield collector" \
            --parameters 'commands=[
              "set -euo pipefail",
              "cd /home/ubuntu/app/trading",
              "git fetch --prune origin",
              "git checkout main",
              "git pull --ff-only origin main",
              "docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile ohlcv build",
              "docker builder prune -af",
              "docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile ohlcv up -d data-btc data-eth ohlcv-collector",
              "docker compose ps"
            ]' \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId=${COMMAND_ID}"
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" || true
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text
