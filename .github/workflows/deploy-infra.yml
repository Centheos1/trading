name: Deploy Infra

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'

permissions:
  id-token: write
  contents: read

environment: production  # GitHub Environment approval gate

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform init
        run: terraform init
      - name: Terraform plan
        id: plan
        run: |
          set -euo pipefail
          terraform plan -detailed-exitcode -out=tfplan || ec=$?
          ec=${ec:-0}
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" -eq 1 ]; then exit 1; fi
      - name: Terraform apply
        if: steps.plan.outputs.exitcode == '2'
        run: terraform apply -auto-approve tfplan
      - name: Skip empty plan
        if: steps.plan.outputs.exitcode == '0'
        run: echo "No infrastructure changes — skip apply"
