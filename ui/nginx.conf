# nginx config for the production UI image.
#
# Strategy:
#   * static assets (the React bundle) are served from /usr/share/nginx/html
#   * /api/* and /stream are reverse-proxied to the strategy service so
#     the browser sees a single origin (no CORS complications) and so
#     the strategy service can stay on an internal-only VPC port in AWS
#
# The upstream host is configurable so the same image works locally
# (``strategy:8000`` via docker-compose) and on AWS ECS (``strategy.internal``
# via service discovery).

upstream strategy_upstream {
    # Resolved at nginx start.  In docker-compose this is the service
    # name ``strategy``; in ECS this is the AWS Cloud Map DNS name.
    server ${STRATEGY_HOST}:${STRATEGY_PORT};
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — every unknown route falls through to index.html so
    # client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket stream — upgrade and proxy.
    location /stream {
        proxy_pass http://strategy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # REST control plane.
    location /api/ {
        proxy_pass http://strategy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long cache for fingerprinted Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
